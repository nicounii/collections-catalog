# Cloudflare Pages — project configuration
#
# PRIMARY PATH: connect this repo to Cloudflare Pages via the dashboard
# (Git integration). The dashboard settings mirror what is declared here.
# See docs/deploy.md for the exact steps.
#
# SECRETS ARE NOT HERE. `AIRTABLE_TOKEN`, `MP_ACCESS_TOKEN`, and
